"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Book {
    id: ID!
    title: String!
    author: String!
    genre: String!
    description: String!
    published_year: Int!
    cover_url: String!

    reviews: [Review!]! @hasMany
    reviewCount: Int! @count(relation: "reviews")
    averageRating: Float! @aggregate(relation: "reviews", function: "avg", column: "rating")
}

type Review {
    id: ID!
    book_id: ID!
    rating: Int!
    comment: String!
    created_at: DateTime!
    updated_at: DateTime!

    book: Book! @belongsTo
}

type Query {
    books: [Book!]! @all
    book(id: ID! @eq): Book @find
    reviews: [Review!]! @all
    review(id: ID! @eq): Review @find
}


